# nginx vhost az "Otthon" (easylife) PWA-hoz.
#
# Telepítés a szerveren:
#   cp deploy/nginx/easylife.szivim.com.conf /etc/nginx/sites-available/easylife.szivim.com.conf
#   ln -s /etc/nginx/sites-available/easylife.szivim.com.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Előfeltétel: a frontend production build a /var/www/easylife/dist alatt van
# (lásd DEPLOY.md), és a self-hosted Supabase stack api-gw (Envoy/Kong) kapuja
# csak a 127.0.0.1:8000-en figyel (lásd DEPLOY.md - API_GW_HTTP_PORT beállítás).
#
# A /etc/ssl/cloudflare alatti wildcard cert/key fájlnevét ELSŐ SSH-s belépéskor
# ellenőrizd (`ls -la /etc/ssl/cloudflare`) és ha más a név, írd át a lenti két
# `ssl_certificate` / `ssl_certificate_key` sort.

server {
    listen 80;
    listen [::]:80;
    server_name easylife.szivim.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name easylife.szivim.com;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    client_max_body_size 20m;

    # --- Supabase API útvonalak -> self-hosted stack (api-gw, csak localhost) ---
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /functions/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime WebSocket
    location /realtime/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Studio/Dashboard szándékosan NINCS nyilvánosan kitéve - ha szükséges,
    # SSH port-forwarddal érhető el: ssh -L 8000:127.0.0.1:8000 <szerver>
    # majd http://localhost:8000 a saját gépen.

    # --- Statikus frontend (Vite build) ---
    root /var/www/easylife/dist;
    index index.html;

    # A service worker és a manifest sose jöjjön cache-ből, különben az app
    # nem kapja meg az új verziót / push-frissítést telepítés után.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
